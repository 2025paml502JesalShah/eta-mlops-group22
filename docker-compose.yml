services:

  api:
    build: .
    container_name: nyc-taxi-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./src:/app/src

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    container_name: nyc-taxi-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlruns/mlflow.db
      --default-artifact-root /mlruns